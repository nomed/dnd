name: Build Cael Light PDFs
on:
  workflow_dispatch:
  push:
    branches: [feat/cael-edizioni-illustrate]
    paths:
      - 'cael/edizioni/*.html'
      - '.github/workflows/cael-light-pdf.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render PDFs
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const name of ['cael-scheda-tavolo-light','cael-grimorio-light']){
              const page=await browser.newPage({viewport:{width:1000,height:1400}});
              await page.goto('file://'+process.cwd()+'/cael/edizioni/'+name+'.html');
              await page.evaluate(async()=>{await Promise.all(Array.from(document.images).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})))});
              await page.pdf({path:'cael/edizioni/'+name+'.pdf',format:'A4',printBackground:true,preferCSSPageSize:true});
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit PDFs to same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cael/edizioni/*-light.pdf
          git diff --cached --quiet || (git commit -m 'build(cael): render light PDF editions' && git push)
